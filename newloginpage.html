<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <script>
        const password= document.getElementById('password')
        const username= document.getElementById('username')
        document.getElementById('form').addEventListener('submit',(event) => {
            event.preventDefault()
            valid = true
            // Add your checks here:
            const password_value = password.value
            const username_value = username.value

            if(username_value.length< 5 || password_value.length < 12){
                alert('The form has not been submitted : \n - A field is not valid.')
                valid = false
            }
            if(valid)
            alert('The form has been submitted.')
        })
    </script>
</head>
<body>
    <form id="form" class="container" method="post">
        <h1>Login</h1>
        <input autocomplete="off" id="username" type="text" placeholder="Username">
        <input autocomplete="off" id="password" type="password" placeholder="Password">
        <button type="submit">Login</button>
    </form>
</body>
</html>
