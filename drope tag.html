<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <script>
        function next(){
            let choice=document.getElementById("social").value;
            if(choice=="Tamil"){
                window.location.href="./music.html";
            }
            else if(choice=="English"){
                window.location.href="./account.html";
            }
            else if(choice=="Malayam"){
                window.location.href="./spanish.html";
            }
            else if(choice=="Hindi"){
                window.location.href="./hindi.html";
            }
        }
    </script>

</head>
<body>
    <select name="" id="social">
        <option value="Tamil">Tamil</option>
        <option value="English">English</option>
        <option value="Malayam">Malayam</option>
        <option value="Hindi">Hindi</option>
    </select><br><br>
    <button onclick="next()">NEXT</button>
</body>
</html>
